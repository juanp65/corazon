<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>AR · Órganos </title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js para marcadores tipo pattern (.patt) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }

    .top-bar {
      position: fixed;
      top: 0; left: 0; width: 100%;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      text-align: center;
      z-index: 10;
    }

    .hint {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 8px 16px;
      border-radius: 18px;
      font-size: 12px;
      text-align: center;
      width: 80%;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    Escanea tus marcadores:  Corazón ·  Cerebro ·  Hígado
  </div>

  <div class="hint">
   Apunta la cámara al <b>marcador correspondiente</b> de cada órgano.
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="logarithmicDepthBuffer:true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- LUCES -->
    <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
    <a-light type="directional" color="#ffffff" intensity="2" position="1 1 1"></a-light>

    <!-- 🫀 CORAZÓN: markers/corazon.patt -->
    <a-marker type="pattern" url="markers/corazon.patt">
      <a-entity rotation="-90 0 0">
        <a-gltf-model
          src="assets/realistic_human_heart.glb"
          scale="0.8 0.8 0.8"
          position="0 0 0"
          rotation="0 0 0"
          animation__rotar="property: rotation; to: 0 -360 0; loop: true; dur: 8000"
        ></a-gltf-model>
      </a-entity>
    </a-marker>

    <!-- 🧠 CEREBRO: markers/cerebro.patt -->
    <a-marker type="pattern" url="markers/cerebro.patt">
      <a-entity rotation="-90 0 0">
        <a-gltf-model
          src="assets/human_brain.glb"
          scale="1.5 1.5 1.5"
          position="0 0 0"
          rotation="0 0 0"
          animation__rotar="property: rotation; to: 0 -360 0; loop: true; dur: 8000"
        ></a-gltf-model>
      </a-entity>
    </a-marker>

    <!-- 🟤 HÍGADO: markers/higado.patt -->
    <a-marker type="pattern" url="markers/higado.patt">
      <a-entity rotation="-90 0 0">
        <a-gltf-model
          src="assets/human_liver.glb"
          scale="0.6 0.6 0.6"
          position="0 0 0"
          rotation="0 0 0"
          animation__rotar="property: rotation; to: 0 -360 0; loop: true; dur: 8000"
        ></a-gltf-model>
      </a-entity>
    </a-marker>

    <!-- CÁMARA -->
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
